name: E2E CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  e2e:
    name: Playwright full stack
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24.15.0"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Reset and start the local stack
        shell: pwsh
        run: ./scripts/local.ps1 reset

      - name: Install Playwright browsers
        working-directory: apps/web
        run: npx playwright install --with-deps

      - name: Run E2E tests
        working-directory: apps/web
        run: npm run e2e -- --workers=1

      - name: Upload API log
        if: failure()
        run: docker logs redsun-api > api.log 2>&1

      - name: Store API log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: api-log
          path: api.log
          if-no-files-found: ignore

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          if-no-files-found: ignore

      - name: Stop local services
        if: always()
        continue-on-error: true
        shell: pwsh
        run: ./scripts/local.ps1 stop
