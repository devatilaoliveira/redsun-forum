@if (fill()) {
  <img
    [ngSrc]="logoSrc()"
    [alt]="alt()"
    [attr.aria-hidden]="alt() ? null : 'true'"
    fill
    [priority]="priority()"
  />
} @else {
  <img
    [ngSrc]="logoSrc()"
    [alt]="alt()"
    [attr.aria-hidden]="alt() ? null : 'true'"
    width="32"
    height="32"
    [priority]="priority()"
  />
}
