name: redsun-api
services:
  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    image: redsun-api:local
    container_name: redsun-api
    env_file:
      - path: .env.local.keys
        required: false
    environment:
      SERVER_PORT: "8080"
      SPRING_PROFILES_ACTIVE: local
      APP_FRONTEND_URL: http://localhost:4200
      APP_LOGOUT_REDIRECT: http://localhost:4200
      CORS_ALLOWED_ORIGINS: http://localhost:4200
      DB_USER: redsun_dev
      DB_PASSWORD: local-redsun-password
      SPRING_DATASOURCE_URL: jdbc:postgresql://host.docker.internal:54322/postgres?sslmode=disable
      SUPABASE_URL: http://host.docker.internal:54321
      SUPABASE_JWT_ISSUER: http://127.0.0.1:54321/auth/v1
      SUPABASE_STORAGE_URL: http://host.docker.internal:54321/storage/v1/object/public/
      BREVO_API_KEY: local-placeholder
      BREVO_SENDER_EMAIL: local-placeholder@redsun.invalid
      BREVO_SENDER_NAME: RedSun_Local
      GEMINI_API_KEY: local-placeholder
      GEMINI_MODEL: gemini-3.1-flash-lite
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:8080"
    restart: unless-stopped
